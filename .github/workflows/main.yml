name: Build FF_Panel_iOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 📥 Checkout do Código
      uses: actions/checkout@v4

    - name: ⚙️ Configurar o Theos
      run: |
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV

    - name: 📦 Instalar Dependências (ldid, dpkg)
      run: |
        brew install ldid dpkg make

    - name: 🛠️ Compilar o Tweak
      run: |
        make clean
        make package
      env:
        THEOS: ${{ env.THEOS }}

    - name: 📁 Organizar Arquivos na Pasta Output
      run: |
        mkdir -p Output
        # Copia o arquivo .deb gerado
        cp packages/*.deb Output/ 
        # Copia a .dylib gerada
        cp .theos/obj/arm64/FF_Panel_iOS.dylib Output/

    - name: 📤 Upload da Pasta Completa (Deb + Dylib)
      uses: actions/upload-artifact@v4
      with:
        name: FF_Panel_iOS_Completo
        path: Output/
        retention-days: 7
