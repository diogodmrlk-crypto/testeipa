name: Build FF_Panel_iOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite rodar manualmente clicando no botão

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 📥 Checkout do Código
      uses: actions/checkout@v4

    - name: ⚙️ Configurar o Theos
      run: |
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV

    - name: 📦 Instalar Dependências (ldid, dpkg, make)
      run: |
        brew install ldid dpkg make

    - name: 🛠️ Compilar o Tweak
      run: |
        make clean
        make package
      env:
        THEOS: ${{ env.THEOS }}

    - name: 📁 Organizar Arquivos na Pasta Output
      run: |
        mkdir -p Output
        # Copia o arquivo .deb (se existir)
        cp packages/*.deb Output/ 2>/dev/null || true
        # Procura a .dylib em qualquer subpasta e copia para Output
        find . -name "FF_Panel_iOS.dylib" -exec cp {} Output/ \;

    - name: 📤 Upload da Pasta Completa (Deb + Dylib)
      uses: actions/upload-artifact@v4
      with:
        name: FF_Panel_iOS_Completo
        path: Output/
        retention-days: 7
